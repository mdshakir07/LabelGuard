# Render Blueprint - LabelGuard
# Deploy by pushing this repo to GitHub and using:
#   Render Dashboard -> New -> Blueprint -> connect this repo
# Blueprint creates 3 auto-wired resources:
#   labelguard-db (managed PostgreSQL)
#   labelguard-api (FastAPI backend web service)
#   labelguard-frontend (Next.js web service)
#
# Live after first deploy (auto-synced below):
#   labelguard-api      -> https://labelguard-api-j8dv.onrender.com
#   labelguard-frontend -> https://labelguard-frontend.onrender.com
#
# Note: Render's container disk is ephemeral - uploaded label images and generated
# reports are lost on redeploy. JWT_SECRET_KEY is generated once on provision.

databases:
  - name: labelguard-db
    plan: free
    databaseName: mitrametrology
    ipAllowList: []

services:
  - type: web
    name: labelguard-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labelguard-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_ROOT
        value: /app/storage
      - key: CORS_ORIGINS
        value: "https://labelguard-frontend.onrender.com"

  - type: web
    name: labelguard-frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "https://labelguard-api-j8dv.onrender.com"