# Render Blueprint - LabelGuard
# Deploy by pushing this repo to GitHub and using:
#   Render Dashboard -> New -> Blueprint -> connect this repo
# Blueprint creates 3 auto-wired resources:
#   labelguard-db (managed PostgreSQL)
#   labelguard-api (FastAPI backend web service)
#   labelguard-frontend (Next.js web service)
#
# AFTER the first deploy (URLs are assigned only then) you MUST update two values:
#   1. Frontend -> env NEXT_PUBLIC_API_URL = backend URL, e.g. https://labelguard-api-xxxx.onrender.com
#      (Render auto-passes env vars to Docker as build args, so it gets baked into the
#      JS bundle on the next Build & Deploy. Then: Manual Deploy -> Clear build cache & deploy)
#   2. Backend  -> env CORS_ORIGINS       = frontend URL, e.g. https://labelguard-frontend-xxxx.onrender.com
#
# Note: Render's container disk is ephemeral - uploaded label images and generated
# reports are lost on redeploy. JWT_SECRET_KEY is generated once on provision.

databases:
  - name: labelguard-db
    plan: free
    databaseName: mitrametrology
    ipAllowList: []

services:
  - type: web
    name: labelguard-api
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: labelguard-db
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ENVIRONMENT
        value: production
      - key: STORAGE_ROOT
        value: /app/storage
      - key: CORS_ORIGINS
        sync: false

  - type: web
    name: labelguard-frontend
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: .
    healthCheckPath: /login
    envVars:
      - key: NEXT_PUBLIC_API_URL
        value: "http://127.0.0.1:8000"